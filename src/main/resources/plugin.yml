name: WarpSystem
version: '0.2-Alpha'
description: "Custom database controller for Build SouthWest Europe's server"
authors:
  - DonatiFilippo
  - THElib03

main: eu.buildsouthwest.warp.WarpSystem
prefix: btewarp
api-version: '26.3'
load: POSTWORLD

commands:
  test:
    description: test the DB
    usage: /test
  createwarp:
    description: Create a new Warp in your position
    usage: /createwarp <name>
  setwarp:
    description: Edit some value of an existing warp
    usage: /createwarp <field> [value]
  warp:
    description: Travel to one of our highlighted builds
    usage: /warp <warp>

permissions:
  warp.test:
    description: ""
    default: op